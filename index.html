<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/pages/index/style-index.css" />
    <script src="assets/js/carrosel-produtos.js" defer></script>
    <title>Landing Page Steampunk</title>
  </head>
  <body class="body">
    <header class="header">
      <nav class="nav">
        <div class="container">
          <a href="index.html"
            ><img src="assets/img/logo.svg" alt="Logo" class="nav-logo"
          /></a>
          <ul class="nav-list">
            <li class="nav-item"><a href="#">NOTÍCIAS</a></li>
            <li class="nav-item"><a href="#">CRIADOR DE AVATAR</a></li>
          </ul>
          <div class="nav-actions">
            <img src="assets/img/icon-mundo.svg" alt="icon" class="nav-icon" />
            <button class="button-iniciar-sessao" type="button">
              INICIAR SESSÃO
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="main">
      <section class="section section-hero">
        <div class="container">
          <h1>TECNOLOGIA</h1>
        </div>
      </section>
      <section class="section section-sobre">
        <div class="container">
          <div class="section-sobre-content">
            <h2>SUB-TITULO</h2>
            <h1>TITULO</h1>
            <p class="section-sobre-content-texto">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis,
              ratione perspiciatis? Iste, nulla unde nam quisquam libero aliquid
              placeat consectetur et minima illum cum ipsam vero tenetur?
            </p>
          </div>

          <div class="section-sobre-image">
            <img
              src="assets/img/robo-steampunk2.jpg"
              alt="robo"
              class="section-sobre-img"
            />
          </div>
        </div>
      </section>
      <section class="section section-produtos">
        <div class="container">
          <h2>SUB-TITULO</h2>
          <div class="section-produtos-conjunto-imagens">
            <img
              src="./assets/img/maquina-steampunk.jpg"
              alt="img1"
              class="section-produtos-img"
            />
            <img
              src="./assets/img/cidade-steampunk2.jpg"
              alt="img2"
              class="section-produtos-img"
            />
            <img
              src="./assets/img/cidade-steampunk1.jpg"
              alt="img3"
              class="section-produtos-img"
            />
            <img
              src="./assets/img/robo-steampunk1.jpg"
              alt="img4"
              class="section-produtos-img"
            />
            <img
              src="./assets/img/arte-abstrato.jpg"
              alt="img5"
              class="section-produtos-img"
            />
          </div>
          <div class="controles">
            <div class="linha"></div>
            <button class="button-left" onclick="left()">&larr;</button>
            <button class="button-right" onclick="right()">&rarr;</button>
          </div>

        </div>
      </section>
      <section class="section section-servicos">
        <div class="card"></div>
      </section>
      <section class="section section-galeria"></section>
      <section class="section section-avatares"></section>
      <section class="section section-saiba-mais"></section>
      <section class="section section-explorar"></section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
